<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VANCE ARENA</title>
  <style>
    :root {
      --accent: #ff6b35;
      --bg: #0a0a14;
      --text: #ffffff;
      --text-dim: #888899;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); user-select: none; }
    #game-container { width: 100vw; height: 100vh; position: relative; }
    #canvas { display: block; width: 100%; height: 100%; cursor: none; }
    .hidden { display: none !important; }

    #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }

    /* Crosshair */
    #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 24px; height: 24px; }
    .ch-line { position: absolute; background: rgba(255,255,255,0.85); box-shadow: 0 0 3px rgba(0,0,0,0.8); }
    .ch-top, .ch-bottom { width: 2px; height: 7px; left: 11px; }
    .ch-top { top: 0; } .ch-bottom { bottom: 0; }
    .ch-left, .ch-right { width: 7px; height: 2px; top: 11px; }
    .ch-left { left: 0; } .ch-right { right: 0; }
    .ch-dot { width: 2px; height: 2px; background: var(--accent); position: absolute; top: 11px; left: 11px; border-radius: 50%; }

    /* Health */
    #health-container { position: absolute; bottom: 28px; left: 28px; }
    .hud-label { font-size: 10px; letter-spacing: 3px; color: var(--text-dim); margin-bottom: 5px; font-weight: 600; }
    #health-bar-bg { width: 200px; height: 6px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); overflow: hidden; }
    #health-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #00ff88, #00cc66); transition: width 0.25s, background 0.25s; }
    #health-value { font-size: 30px; font-weight: 800; line-height: 1; margin-top: 4px; }

    /* Score */
    #score-container { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); text-align: center; }
    #score-value { font-size: 40px; font-weight: 900; line-height: 1; letter-spacing: 1px; }

    /* Wave */
    #wave-container { position: absolute; top: 24px; right: 28px; text-align: right; }
    #wave-value { font-size: 28px; font-weight: 800; color: var(--accent); line-height: 1; }

    /* Ammo */
    #ammo-container { position: absolute; bottom: 28px; right: 28px; }
    #ammo-row { display: flex; align-items: baseline; gap: 6px; justify-content: flex-end; }
    #ammo-value { font-size: 38px; font-weight: 900; line-height: 1; }
    #ammo-sep { font-size: 20px; color: var(--text-dim); }
    #ammo-reserve { font-size: 22px; color: var(--text-dim); font-weight: 600; }
    #ammo-reloading { font-size: 12px; color: var(--accent); letter-spacing: 2px; text-align: right; margin-top: 4px; }
    #weapon-hud { font-size: 11px; color: var(--text-dim); letter-spacing: 2px; text-align: right; margin-top: 6px; font-weight: 600; }

    /* Hit marker */
    #hit-marker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 20px; height: 20px; opacity: 0; }
    #hit-marker .hm-line { position: absolute; background: #fff; }
    #hit-marker .hm-tl, #hit-marker .hm-br { width: 2px; height: 8px; }
    #hit-marker .hm-tr, #hit-marker .hm-bl { width: 8px; height: 2px; }
    #hit-marker .hm-tl { top: 0; left: 9px; } #hit-marker .hm-tr { top: 9px; right: 0; }
    #hit-marker .hm-bl { bottom: 9px; left: 0; } #hit-marker .hm-br { bottom: 0; right: 9px; }
    #hit-marker.headshot .hm-line { background: var(--accent); }

    /* Damage vignette */
    #damage-vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px rgba(255,30,30,0); transition: box-shadow 0.08s; }

    /* Kill feed */
    #kill-feed { position: absolute; top: 70px; right: 28px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
    .kill-msg { background: rgba(0,0,0,0.5); padding: 5px 14px; font-size: 13px; font-weight: 700; color: var(--accent); border-left: 3px solid var(--accent); }
    .kill-msg.headshot { color: #ffaa00; border-color: #ffaa00; }

    /* Wave announce */
    #wave-announce { position: absolute; top: 35%; left: 50%; transform: translate(-50%, -50%); text-align: center; opacity: 0; transition: opacity 0.3s; }
    #wave-announce .wa-title { font-size: 48px; font-weight: 900; letter-spacing: 6px; color: var(--accent); text-shadow: 0 0 30px rgba(255,107,53,0.5); }
    #wave-announce .wa-sub { font-size: 16px; color: var(--text-dim); letter-spacing: 4px; margin-top: 6px; }

    /* Screens */
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; pointer-events: auto; background: rgba(8,8,18,0.88); }
    #start-screen h1 { font-size: 72px; font-weight: 900; letter-spacing: 10px; text-shadow: 0 0 40px rgba(255,107,53,0.4); margin-bottom: 4px; }
    .subtitle { font-size: 16px; color: var(--accent); letter-spacing: 6px; margin-bottom: 36px; }

    /* Loadout */
    .loadout { margin-bottom: 32px; display: flex; flex-direction: column; gap: 18px; }
    .loadout-row { text-align: center; }
    .selector { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 6px 0; }
    .sel-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: var(--text); padding: 8px 14px; font-size: 14px; cursor: pointer; border-radius: 3px; transition: all 0.15s; }
    .sel-btn:hover { background: rgba(255,107,53,0.2); border-color: var(--accent); }
    #weapon-name-sel, #map-name-sel { font-size: 22px; font-weight: 800; letter-spacing: 2px; min-width: 220px; text-align: center; }
    #weapon-stats { font-size: 12px; color: var(--text-dim); letter-spacing: 1px; }

    .controls-grid { display: grid; grid-template-columns: repeat(3, auto); gap: 12px 28px; margin-bottom: 36px; }
    .ctrl { display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-size: 14px; }
    kbd { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); padding: 3px 10px; font-size: 12px; font-weight: 700; border-radius: 3px; min-width: 36px; text-align: center; }
    .btn-play { background: var(--accent); color: var(--text); border: none; padding: 18px 56px; font-size: 18px; font-weight: 800; letter-spacing: 3px; cursor: pointer; border-radius: 2px; transition: all 0.2s; box-shadow: 0 4px 20px rgba(255,107,53,0.3); }
    .btn-play:hover { background: #ff8555; transform: translateY(-2px); box-shadow: 0 6px 28px rgba(255,107,53,0.5); }
    .btn-secondary { background: transparent; color: var(--text-dim); border: 1px solid rgba(255,255,255,0.2); padding: 12px 36px; font-size: 14px; font-weight: 600; letter-spacing: 2px; cursor: pointer; margin-top: 12px; border-radius: 2px; }
    .btn-secondary:hover { color: var(--text); border-color: rgba(255,255,255,0.5); }

    #game-over-screen h1 { font-size: 60px; font-weight: 900; letter-spacing: 8px; color: #ff3344; margin-bottom: 24px; }
    #final-stats { text-align: center; margin-bottom: 36px; }
    #final-score { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
    #final-wave { font-size: 16px; color: var(--text-dim); letter-spacing: 2px; }
    #pause-screen h1 { font-size: 52px; font-weight: 900; letter-spacing: 8px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div id="hud" class="hidden">
      <div id="crosshair">
        <div class="ch-line ch-top"></div><div class="ch-line ch-bottom"></div>
        <div class="ch-line ch-left"></div><div class="ch-line ch-right"></div>
        <div class="ch-dot"></div>
      </div>
      <div id="health-container">
        <div class="hud-label">HEALTH</div>
        <div id="health-bar-bg"><div id="health-bar-fill"></div></div>
        <div id="health-value">100</div>
      </div>
      <div id="score-container"><div class="hud-label">SCORE</div><div id="score-value">0</div></div>
      <div id="wave-container"><div class="hud-label">WAVE</div><div id="wave-value">1</div></div>
      <div id="ammo-container">
        <div id="ammo-row"><div id="ammo-value">30</div><div id="ammo-sep">/</div><div id="ammo-reserve">∞</div></div>
        <div id="ammo-reloading" class="hidden">RELOADING</div>
        <div id="weapon-hud"></div>
      </div>
      <div id="hit-marker"><div class="hm-line hm-tl"></div><div class="hm-line hm-tr"></div><div class="hm-line hm-bl"></div><div class="hm-line hm-br"></div></div>
      <div id="damage-vignette"></div>
      <div id="kill-feed"></div>
      <div id="wave-announce"><div class="wa-title"></div><div class="wa-sub"></div></div>
    </div>

    <div id="start-screen" class="screen">
      <h1>VANCE ARENA</h1>
      <div class="subtitle">3D ARENA SHOOTER</div>
      <div class="loadout">
        <div class="loadout-row">
          <div class="hud-label">WEAPON</div>
          <div class="selector">
            <button class="sel-btn" id="weapon-prev">◀</button>
            <span id="weapon-name-sel">ASSAULT RIFLE</span>
            <button class="sel-btn" id="weapon-next">▶</button>
          </div>
          <div id="weapon-stats">DMG 34 · RPM 600 · MAG 30</div>
        </div>
        <div class="loadout-row">
          <div class="hud-label">MAP</div>
          <div class="selector">
            <button class="sel-btn" id="map-prev">◀</button>
            <span id="map-name-sel">INDUSTRIAL</span>
            <button class="sel-btn" id="map-next">▶</button>
          </div>
        </div>
      </div>
      <div class="controls-grid">
        <div class="ctrl"><kbd>WASD</kbd> Move</div>
        <div class="ctrl"><kbd>MOUSE</kbd> Look</div>
        <div class="ctrl"><kbd>CLICK</kbd> Shoot</div>
        <div class="ctrl"><kbd>SHIFT</kbd> Sprint</div>
        <div class="ctrl"><kbd>SPACE</kbd> Jump</div>
        <div class="ctrl"><kbd>R</kbd> Reload</div>
      </div>
      <button class="btn-play" id="play-btn">DEPLOY</button>
    </div>

    <div id="game-over-screen" class="screen hidden">
      <h1>ELIMINATED</h1>
      <div id="final-stats"><div id="final-score">Score: 0</div><div id="final-wave">Reached Wave 1</div></div>
      <button class="btn-play" id="restart-btn">PLAY AGAIN</button>
    </div>

    <div id="pause-screen" class="screen hidden">
      <h1>PAUSED</h1>
      <button class="btn-play" id="resume-btn">RESUME</button>
      <button class="btn-secondary" id="quit-btn">QUIT TO MENU</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
