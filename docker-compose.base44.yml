services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: vance
      POSTGRES_PASSWORD: vance
      POSTGRES_DB: vance
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vance -d vance"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/work:ro
    environment:
      PGPASSWORD: vance
    command: ["sh", "-c", "psql -h postgres -U vance -d vance -f /work/app/db/schema.sql"]

  # --- Backend API (economy service, port 8000) ---
  api:
    image: python:3.12-slim
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      VANCE_DATABASE_URL: postgresql://vance:vance@postgres:5432/vance
      VANCE_REDIS_URL: redis://redis:6379/0
    command:
      - sh
      - -ec
      - |
        pip install --no-cache-dir -e . &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs').read()\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --- Game frontend (preview entry point, port 3000) ---
  web:
    image: node:22-slim
    restart: on-failure
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      - sh
      - -ec
      - |
        npm install &&
        exec npm run dev
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
  frontend_node_modules:
